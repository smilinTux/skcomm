[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skcomm"
version = "0.1.3"
description = "DEPRECATED shim — re-exports skcomms. Migrate to: pip install skcomms"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [
    {name = "smilinTux.org", email = "hello@smilintux.org"},
]
keywords = [
    "ai", "agent", "communication", "p2p", "encrypted",
    "transport", "messaging", "sovereign", "syncthing",
]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "skcomms>=0.1.3",
]

[project.optional-dependencies]
# Keep extras as no-ops so existing install commands don't error
cli = []
crypto = []
nostr = []
websocket = []
webrtc = []
discovery = []
api = []
all = []
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
# Legacy entry points — proxy to skcomms implementations
skcomm = "skcomms.cli:main"
skcomm-mcp = "skcomms.mcp_server:main"

[project.urls]
Homepage = "https://smilintux.org"
Repository = "https://github.com/smilinTux/skcomm"
Issues = "https://github.com/smilinTux/skcomm/issues"
Changelog = "https://github.com/smilinTux/skcomm/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
